name: Build hardened image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly rebuild to pick up new Alpine / Go / Go-module security fixes
    # even when upstream has not released.
    - cron: '7 6 * * 1'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/syncthing
  TRIVY_IMAGE: docker.io/aquasec/trivy:0.76.2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      HC_PING_URL: ${{ secrets.HC_PING_URL }}   # optional
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare hardened build context
        id: prep
        run: |
          upstream="$(tr -d '[:space:]' < UPSTREAM_VERSION)"
          ./scripts/prepare.sh "$upstream"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          {
            echo "args<<EOF"
            cat build/build-args
            echo "HARDENED_VERSION=$upstream-hardened-$(date -u +%Y%m%d)"
            echo "HARDENED_SOURCE=${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (amd64, loaded locally for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: build/src
          file: build/src/Dockerfile.hardened
          platforms: linux/amd64
          load: true
          push: false
          pull: true
          no-cache: true   # never reuse a stale `apk upgrade` / `go get` layer
          build-args: ${{ steps.prep.outputs.args }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.prep.outputs.upstream }}-hardened
            ${{ env.IMAGE }}:${{ steps.prep.outputs.upstream }}-hardened-${{ steps.prep.outputs.date }}
            ${{ env.IMAGE }}:latest-hardened

      - name: Trivy full report
        run: |
          mkdir -p reports
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/reports:/reports" \
            "$TRIVY_IMAGE" image --scanners vuln --format json --output /reports/trivy.json \
            "$IMAGE:latest-hardened"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            "$TRIVY_IMAGE" image --scanners vuln --format table "$IMAGE:latest-hardened" \
            | tee reports/trivy.txt

      - name: Trivy gate (fail on fixable CRITICAL/HIGH)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore.yaml:/.trivyignore.yaml:ro" \
            "$TRIVY_IMAGE" image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed \
            --ignorefile /.trivyignore.yaml --exit-code 1 "$IMAGE:latest-hardened"

      - name: Smoke test
        run: ./scripts/smoke-test.sh "$IMAGE:latest-hardened"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trivy-${{ steps.prep.outputs.upstream }}
          path: reports/
          if-no-files-found: ignore

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker push --all-tags "$IMAGE"

      - name: Ping Healthchecks.io
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.HC_PING_URL != ''
        run: curl -fsS -m 10 --retry 3 "$HC_PING_URL" > /dev/null
